services:
  zookeeper:
    image: zookeeper:3.9.3
    container_name: pinot-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_PORT: 2181
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    volumes:
      - ./pinot-docker-demo/zookeeper/data:/data
      - ./pinot-docker-demo/zookeeper/datalog:/datalog

  kafka:
    image: apache/kafka:4.0.0
    container_name: pinot-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: pinot-kafka-cluster-001
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./pinot-docker-demo/kafka/data:/var/lib/kafka/data

  pinot-controller:
    image: apachepinot/pinot:1.5.1
    container_name: pinot-controller
    hostname: pinot-controller
    volumes:
      - ./pinot-docker-demo/pinot/controller:/tmp/data/controller
    ports:
      - "9000:9000"
    command: StartController -zkAddress zookeeper:2181 -controllerHost pinot-controller -dataDir /tmp/data/controller
    depends_on:
      - zookeeper
      - kafka

  pinot-broker:
    image: apachepinot/pinot:1.5.1
    container_name: pinot-broker
    hostname: pinot-broker
    ports:
      - "8099:8099"
    command: StartBroker -zkAddress zookeeper:2181 -brokerHost pinot-broker
    depends_on:
      - zookeeper
      - kafka
      - pinot-controller

  pinot-server:
    image: apachepinot/pinot:1.5.1
    container_name: pinot-server
    hostname: pinot-server
    volumes:
      - ./pinot-docker-demo/pinot/server:/tmp/data/server
    ports:
      - "8098:8098"
    command: StartServer -zkAddress zookeeper:2181 -serverHost pinot-server -dataDir /tmp/data/server/data -segmentDir /tmp/data/server/segments
    depends_on:
      - zookeeper
      - kafka
      - pinot-controller

  pinot-minion:
    image: apachepinot/pinot:1.5.1
    container_name: pinot-minion
    hostname: pinot-minion
    volumes:
      - ./pinot-docker-demo/pinot/minion:/tmp/data/minion
    ports:
      - "9514:9514"
    command: StartMinion -zkAddress zookeeper:2181 -minionHost pinot-minion
    depends_on:
      - zookeeper
      - kafka
      - pinot-controller

networks:
  default:
    name: pinot-lg14
